# Reusable workflow: fail a PR when an untrusted document reaches an LLM prompt unguarded,
# and (optionally) have Jev judge sample documents for prompt injection.
#
# In any SAAF repo, add .github/workflows/data-not-instructions.yml:
#
#   on: [pull_request]
#   permissions:
#     contents: read
#   jobs:
#     guard:
#       uses: SAAF-Project/data-not-instructions/.github/workflows/check-prompts.yml@main
#       with:
#         paths: "."                        # optional: directories to scan
#         documents: "samples/**/*.txt"     # optional: files for Jev to judge
#       secrets:
#         JEV: ${{ secrets.JEV }}           # TypeSafe API key; without it Jev is skipped
#
# The Jev step runs only when both `documents` and the secret are set. It fails
# the job when any document is judged "injection" or "review".
name: check-prompts

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated paths to scan
        type: string
        default: "."
      documents:
        description: Space-separated files or globs (bash globstar) for Jev to judge
        type: string
        default: ""
    secrets:
      JEV:
        description: TypeSafe API key; enables the Jev judge
        required: false

permissions:
  contents: read

env:
  # Scripts are stdlib-only, so `uv run` fetches and runs them straight from this repo.
  DNI: https://raw.githubusercontent.com/SAAF-Project/data-not-instructions/main

jobs:
  check-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Scan for unguarded prompts
        env:
          SCAN_PATHS: ${{ inputs.paths }}
        shell: bash
        run: |
          read -ra paths <<< "${SCAN_PATHS}"
          uv run "${DNI}/check_prompts.py" "${paths[@]}"
      - name: Judge documents with Jev
        if: ${{ inputs.documents != '' }}
        env:
          DOCUMENTS: ${{ inputs.documents }}
          JEV: ${{ secrets.JEV }}
        shell: bash
        run: |
          if [ -z "${JEV}" ]; then
            echo "::notice::JEV secret not set; skipping Jev judge"
            exit 0
          fi
          shopt -s globstar
          read -ra patterns <<< "${DOCUMENTS}"
          files=()
          for p in "${patterns[@]}"; do
            mapfile -t matched < <(compgen -G "${p}")
            files+=("${matched[@]}")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::documents matched no files: ${DOCUMENTS}"
            exit 1
          fi
          uv run "${DNI}/jev_judge.py" "${files[@]}"
