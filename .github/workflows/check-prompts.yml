# Offline reusable check. Provider evaluations are a separate authorised operation.
name: check-prompts
on:
  workflow_call:
    inputs:
      paths:
        description: Relative source paths (shell-style quoting allows spaces)
        type: string
        default: '.'
      documents:
        description: Legacy provider input; nonempty values are rejected, never skipped as passed
        type: string
        default: ''
    secrets:
      JEV:
        description: Legacy compatibility parameter, never exposed to any offline step
        required: false
permissions:
  contents: read
jobs:
  check-prompts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a separate provider evaluation
        env:
          REQUESTED_DOCUMENTS: ${{ inputs.documents }}
        run: |
          if [ -n "$REQUESTED_DOCUMENTS" ]; then
            echo 'Provider evaluation is NOT ASSESSED here. Run it separately with approved data and budget.' >&2
            exit 2
          fi
      - name: Check out caller source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
      - name: Check out the reviewed checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAAF-Project/data-not-instructions
          ref: 7871889ad02f35e501dc9dcfe8d3bb65efffde18
          path: checker
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Scan with isolated Python and a caller path boundary
        env:
          SCAN_PATHS: ${{ inputs.paths }}
        run: python -I checker/run_check.py caller "$SCAN_PATHS"
