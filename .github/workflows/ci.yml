name: offline CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python demo/demo.py
      - run: python check_prompts.py demo
      - run: python scorecard.py

  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAAF-Project/saaf-living-map
          ref: 068ad51d476ae7090cd4abb8bf395be82e4b2f90
          path: living-map
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r target/requirements-dev.txt
      - name: Validate with the existing Living Map rules
        run: |
          python - <<'PYCODE'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("living_map", "living-map/scripts/build_map.py")
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)
          entry = validator.entry("SAAF-Project/data-not-instructions", Path("target/agent.yaml").read_text(), "local", "repo")
          assert not entry["warnings"], entry["warnings"]
          assert entry["has_mandate"]
          assert entry["confirmed"] is False
          print("Manifest valid; owner confirmation remains pending")
          PYCODE
